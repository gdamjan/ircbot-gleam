name = "ircbot"
version = "0.1.0"
licences = ["GPL-3.0"]
description = "A Gleam ircbot"
repository = { type = "github", user = "gdamjan", repo = "ircbot-gleam" }
gleam = ">= 1.13.0"
target = "erlang" # Erlang/OTP >= 27

[dependencies]
gleam_erlang = ">= 1.2.0 and < 2.0.0"
gleam_http = ">= 4.1.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.0.2 and < 4.0.0"
gleam_time = ">= 1.4.0 and < 2.0.0"
envoy = ">= 1.0.2 and < 2.0.0"
simplifile = ">= 2.2.0 and < 3.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.2.0 and < 2.0.0"
